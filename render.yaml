services:
  - type: static
    name: global-earth
    publishPath: .
    # No build step required (fully static; vendor/ is gitignored on HF but
    # committed for static hosts — MapLibre falls back to pinned CDN).
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /js/config.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
